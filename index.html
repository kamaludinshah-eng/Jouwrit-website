<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JouwRit – Plan Je Rit</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#172033}
.wrap{max-width:980px;margin:30px auto;padding:0 16px}
.card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:0 0 6px;font-size:30px}.sub{color:#697386;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d9dde5;border-radius:10px;font-size:15px;background:#fff}
.autocomplete{position:relative}
.suggestions{position:absolute;z-index:20;top:100%;left:0;right:0;margin-top:5px;background:#fff;border:1px solid #d9dde5;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.13);overflow:hidden}
.suggestions:empty{display:none}
.suggestion{width:100%;margin:0;padding:12px 14px;border:0;border-bottom:1px solid #edf0f4;border-radius:0;background:#fff;color:#172033;text-align:left;font-size:14px;font-weight:400;cursor:pointer}
.suggestion:last-child{border-bottom:0}.suggestion:hover,.suggestion:focus{background:#fff6cc;outline:none}
.suggestion strong{display:block;margin-bottom:3px}.suggestion small{display:block;color:#697386;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea{min-height:110px;resize:vertical}
.section{border-top:1px solid #e7e9ee;margin-top:22px;padding-top:22px}
.section h2{font-size:19px;margin:0 0 16px}
.choice{display:flex;gap:10px}.choice label{flex:1;margin:0}
.choice input{display:none}.choice span{display:block;border:1px solid #d9dde5;border-radius:10px;padding:13px;text-align:center;cursor:pointer}
.choice input:checked+span{border-color:#f4c400;background:#fff6cc}
.hidden{display:none}
.price{margin-top:22px;background:#f7f8fa;border-radius:14px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.price strong{font-size:25px}.muted{color:#697386;font-size:13px}
button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:11px;background:#f4c400;color:#111;font-size:17px;font-weight:800;cursor:pointer}
.note{font-size:13px;color:#697386;margin-top:10px;line-height:1.5}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Plan Je Rit</h1>
    <div class="sub">Vul je ritgegevens in en vraag eenvoudig je taxi aan.</div>

    <div class="grid">
      <div><label for="pickup">Ophaallocatie</label><div class="autocomplete"><input id="pickup" placeholder="Begin een adres te typen" autocomplete="off" aria-autocomplete="list"><div id="pickupSuggestions" class="suggestions" role="listbox"></div></div></div>
      <div><label for="destination">Bestemming</label><div class="autocomplete"><input id="destination" placeholder="Begin een adres te typen" autocomplete="off" aria-autocomplete="list"><div id="destinationSuggestions" class="suggestions" role="listbox"></div></div></div>
      <div><div><label>Datum</label><input id="date" type="date"></div></div>
      <div><div><label>Tijd</label><input id="time" type="time"></div></div>
      <div><div><label>Aantal personen</label><select id="passengers"><option>1</option><option>2</option><option>3</option><option>4</option></select></div></div>
      <div><div><label>Aantal bagage</label><select id="luggage"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select></div></div>
    </div>

    <div class="section">
      <h2>✈️ Airport / vlucht</h2>
      <div class="choice">
        <label><input type="radio" name="airport" value="no" checked onchange="toggleAirport(false)"><span>Geen airportrit</span></label>
        <label><input type="radio" name="airport" value="yes" onchange="toggleAirport(true)"><span>Ja, airportrit</span></label>
      </div>
      <div id="airportFields" class="grid hidden" style="margin-top:18px">
        <div><label>Airport</label><input id="airport" placeholder="Bijv. Eindhoven Airport"></div>
        <div><label>Vluchtnummer</label><input id="flight" placeholder="Bijv. KL1234"></div>
        <div><label>Type</label><select id="flightType"><option>Aankomst</option><option>Vertrek</option></select></div>
        <div><label>Vluchttijd</label><input id="flightTime" type="time"></div>
      </div>
    </div>

    <div class="section">
      <h2>💶 Prijskeuze</h2>
      <div class="choice">
        <label><input type="radio" name="priceType" value="meter" checked onchange="togglePrice()"><span><b>Taximeter</b><br><small>€4,02 + €2,96/km + €0,49/min</small></span></label>
        <label><input type="radio" name="priceType" value="fixed" onchange="togglePrice()"><span><b>Vaste prijs</b><br><small>Prijs vooraf berekend</small></span></label>
      </div>
      <div id="fixedInfo" class="note hidden">Een vaste prijs wordt na controle van de route vooraf bepaald.</div>
    </div>

    <div class="section">
      <h2>💬 Extra informatie</h2>
      <textarea id="extra" placeholder="Bijvoorbeeld: kinderen/kinderzitje, veel bagage, rolstoel, speciale wensen of belangrijke informatie..."></textarea>
    </div>

    <div class="section">
      <h2>👤 Jouw gegevens</h2>
      <div class="grid">
        <div><label>Naam</label><input id="name" placeholder="Voor- en achternaam"></div>
        <div><label>Telefoonnummer</label><input id="phone" type="tel" placeholder="06 12345678"></div>
        <div class="full"><label>E-mail</label><input id="email" type="email" placeholder="naam@email.nl"></div>
      </div>
    </div>

    <div class="price">
      <div><div class="muted">Geschatte ritprijs</div><strong id="price">Wordt berekend</strong></div>
      <div id="routeSummary" class="muted"></div>
    </div>

    <button type="button" onclick="calculateRoute()">🧭 Bereken mijn rit</button>
    <button type="button" onclick="submitBooking()">🚕 Rit aanvragen</button>
    <div id="result" class="note"></div>
  </div>
</div>

<script>
function toggleAirport(show){document.getElementById('airportFields').classList.toggle('hidden',!show)}
function toggleChildren(show){document.getElementById('childrenFields').classList.toggle('hidden',!show)}
function togglePrice(){document.getElementById('fixedInfo').classList.toggle('hidden',document.querySelector('input[name=priceType]:checked').value!=='fixed')}

function attachAutocomplete(inputId){
  const input=document.getElementById(inputId);
  const list=document.getElementById(inputId+'Suggestions');
  let timer,controller;

  function close(){list.innerHTML='';}
  input.addEventListener('input',()=>{
    delete input.dataset.lat; delete input.dataset.lon;
    window.jouwritRoute=null;
    document.getElementById('price').textContent='Wordt berekend';
    clearTimeout(timer); if(controller) controller.abort(); close();
    const query=input.value.trim();
    if(query.length<3) return;
    timer=setTimeout(async()=>{
      controller=new AbortController();
      try{
        const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=nl&q='+encodeURIComponent(query);
        const response=await fetch(url,{signal:controller.signal});
        if(!response.ok) return;
        const data=await response.json();
        close();
        for(const result of data||[]){
          const p=result.address||{};
          const titleText=[p.road||p.pedestrian||p.square||result.name,p.house_number].filter(Boolean).join(' ') || result.display_name.split(',')[0];
          const button=document.createElement('button');
          button.type='button'; button.className='suggestion'; button.setAttribute('role','option');
          const title=document.createElement('strong'); title.textContent=titleText;
          const detail=document.createElement('small'); detail.textContent=result.display_name;
          button.append(title,detail);
          button.addEventListener('click',()=>{
            input.value=result.display_name;
            input.dataset.lon=result.lon;
            input.dataset.lat=result.lat;
            close(); input.focus();
          });
          list.appendChild(button);
        }
      }catch(error){if(error.name!=='AbortError') close();}
    },900);
  });
  input.addEventListener('keydown',event=>{if(event.key==='Escape') close();});
  document.addEventListener('click',event=>{if(!input.parentElement.contains(event.target)) close();});
}

attachAutocomplete('pickup');
attachAutocomplete('destination');

async function geocode(address,inputId){
  const input=document.getElementById(inputId);
  if(input.dataset.lat && input.dataset.lon){
    return {lat:Number(input.dataset.lat),lon:Number(input.dataset.lon),name:input.value};
  }
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=nl&q='+encodeURIComponent(address);
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('Geocoding mislukt');
  const data=await r.json();
  if(!data.length) throw new Error('Adres niet gevonden: '+address);
  return {lat:Number(data[0].lat),lon:Number(data[0].lon),name:data[0].display_name};
}

async function calculateRoute(){
  const pickup=document.getElementById('pickup').value.trim();
  const destination=document.getElementById('destination').value.trim();
  const result=document.getElementById('result');
  if(!pickup || !destination){
    result.textContent='Vul eerst de ophaallocatie en bestemming in.';
    return;
  }
  result.textContent='Route wordt berekend…';
  try{
    const a=await geocode(pickup,'pickup'), b=await geocode(destination,'destination');
    const url=`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
    const r=await fetch(url);
    if(!r.ok) throw new Error('Routeberekening mislukt');
    const data=await r.json();
    if(data.code!=='Ok' || !data.routes?.length) throw new Error('Geen rijroute gevonden.');
    const route=data.routes[0];
    const km=route.distance/1000;
    const min=route.duration/60;
    const price=4.02+(2.96*km)+(0.49*min);
    document.getElementById('price').textContent='€ '+price.toFixed(2).replace('.',',');
    document.getElementById('routeSummary').textContent=`${km.toFixed(1)} km · ${Math.round(min)} min`;
    result.textContent='Route en geschatte taximeterprijs berekend.';
    window.jouwritRoute={km,min,price,pickup:a.name,destination:b.name};
  }catch(e){
    result.textContent=e.message+' Probeer het adres opnieuw.';
  }
}

function submitBooking(){
  const required=[
    ['pickup','Ophaallocatie'],
    ['destination','Bestemming'],
    ['date','Datum'],
    ['time','Tijd'],
    ['name','Naam'],
    ['phone','Telefoonnummer']
  ];

  for(const [id,label] of required){
    if(!document.getElementById(id).value.trim()){
      document.getElementById('result').textContent='Vul eerst '+label+' in.';
      document.getElementById(id).focus();
      return;
    }
  }

  if(!window.jouwritRoute){
    document.getElementById('result').textContent='Bereken eerst de route en prijs.';
    return;
  }

  const value=id=>document.getElementById(id)?.value?.trim()||'-';
  const rit=window.jouwritRoute;
  const prijskeuze=new URLSearchParams(window.location.search).get('priceType')==='fixed'
    ? 'Vaste prijs'
    : 'Taximeter';

  const bericht=`🚕 NIEUWE JOUWRIT AANVRAAG

👤 Naam: ${value('name')}
📞 Telefoon: ${value('phone')}
✉️ E-mail: ${value('email')}

📍 Ophalen: ${rit.pickup}
🏁 Bestemming: ${rit.destination}
📅 Datum: ${value('date')}
🕐 Tijd: ${value('time')}
👥 Personen: ${value('passengers')}
🧳 Bagage: ${value('luggage')}
✈️ Airportrit: ${document.querySelector('input[name="airport"]:checked')?.value==='yes'?'Ja':'Nee'}
🏢 Airport: ${value('airport')}
🛬 Vluchtnummer: ${value('flight')}
🔄 Vluchttype: ${value('flightType')}
🕐 Vluchttijd: ${value('flightTime')}
📝 Extra informatie: ${value('extra')}

🛣️ Afstand: ${rit.km.toFixed(1)} km
⏱️ Geschatte reistijd: ${Math.round(rit.min)} minuten
💶 Geschatte ritprijs: €${rit.price.toFixed(2).replace('.',',')}
💳 Prijskeuze: ${prijskeuze}`;

  document.getElementById('result').textContent='WhatsApp wordt geopend...';
  window.open('https://wa.me/31629098099?text='+encodeURIComponent(bericht),'_blank');
}
</script>
</body>
</html>
